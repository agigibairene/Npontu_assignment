<!DOCTYPE html>
<html>
<head>
    <title>Health Check</title>
</head>
<body>
    <h2>Service Health Check</h2>

    <form method="POST">
        {% csrf_token %}
        <input 
            type="url" 
            name="url" 
            placeholder="Enter URL" 
            required
        />
        <button type="submit">Check</button>
    </form>

    {% if result %}
        <hr>
        <p><strong>URL:</strong> {{ result.url }}</p>
        <p><strong>Status Code:</strong> {{ result.status_code }}</p>
        <p>
            <strong>Health:</strong>
            {% if result.healthy %}
                Healthy
            {% else %}
                Unhealthy
            {% endif %}
        </p>
    {% endif %}
</body>
</html>
